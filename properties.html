<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ممتلكاتي - Star Nova</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --bg-main: #ffffff;
  --bg-card: rgba(255, 255, 255, 0.9);
  --bg-soft: rgba(0, 0, 0, 0.03);
  --text-primary: #151622;
  --text-secondary: #5b5d6e;
  --text-tertiary: #9395a5;
  --border: rgba(0, 0, 0, 0.08);
  --success: #0fa96e;
  --danger: #e03858;
  --warning: #c9791a;
  --gold: #b8912a;
  --safe-bottom: env(safe-area-inset-bottom, 20px);
  --safe-top: env(safe-area-inset-top, 20px);
  --dock-height: 64px;
  --top-bar-height: 10vh;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --nav-bg: rgba(255, 255, 255, 0.4);
  --nav-border: rgba(0, 0, 0, 0.06);
  --gradient-primary: linear-gradient(135deg, #1a1c2e 0%, #2d3048 100%);
  --gradient-blue: linear-gradient(135deg, #5B8DEF 0%, #3B6FDB 100%);
  --gradient-gold: linear-gradient(135deg, #F5D76E 0%, #C9A227 100%);
  --gradient-success: linear-gradient(135deg, #34D399 0%, #10B981 100%);
  --gradient-danger: linear-gradient(135deg, #FF6B81 0%, #E63950 100%);
  --shadow-card: 0 10px 28px rgba(30, 40, 80, 0.06), 0 1px 3px rgba(0,0,0,0.04);
  --shadow-glass: 0 6px 22px rgba(30, 40, 80, 0.05), inset 0 1px 0 rgba(255,255,255,0.85);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg-main); color: var(--text-primary);
  font-size: 15px; line-height: 1.5;
  overscroll-behavior: none; user-select: none; -webkit-user-select: none; direction: rtl;
  position: relative;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 15% 0%, rgba(245, 215, 110, 0.06), transparent 55%),
    radial-gradient(ellipse 55% 40% at 98% 12%, rgba(201, 162, 39, 0.04), transparent 55%),
    radial-gradient(ellipse 75% 55% at 50% 108%, rgba(140, 90, 220, 0.04), transparent 60%);
  pointer-events: none; z-index: 0;
}
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
img { pointer-events: none; -webkit-touch-callout: none; }
::-webkit-scrollbar { display: none; }

/* APP SHELL */
.app-container {
  display: flex; flex-direction: column; height: 100dvh;
  position: relative; z-index: 1;
  max-width: 480px; margin: 0 auto; overflow: hidden;
}
.top-app-bar {
  position: absolute; top: 0; left: 0; right: 0;
  height: calc(var(--top-bar-height) + var(--safe-top));
  background: rgba(255, 255, 255, 0.55);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: none; border-radius: 0; box-shadow: none;
  z-index: 50; padding-top: var(--safe-top);
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 65%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 0%, #000 65%, transparent 100%);
}
.floating-balances {
  position: absolute;
  top: calc(var(--top-bar-height) + var(--safe-top) + 10px);
  left: 16px; right: 16px;
  display: flex; justify-content: space-between; z-index: 51;
}
.balance-pill {
  display: flex; align-items: center;
  background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(255,255,255,0.72));
  -webkit-backdrop-filter: blur(14px) saturate(170%);
  backdrop-filter: blur(14px) saturate(170%);
  border: 1px solid rgba(0, 0, 0, 0.08);
  border-radius: 999px;
  padding: 3px 10px 3px 10px; gap: 6px;
  color: var(--text-primary); font-weight: 800; font-size: 15px;
  box-shadow: 0 6px 18px rgba(30,40,80,0.06), inset 0 1px 0 rgba(255,255,255,0.9);
}
.balance-pill img { width: 20px; height: 20px; border-radius: 50%; }
.balance-pill span { direction: ltr; font-variant-numeric: tabular-nums; }

.main-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: calc(var(--top-bar-height) + var(--safe-top) + 60px) 16px calc(var(--dock-height) + 40px + var(--safe-bottom));
  -webkit-overflow-scrolling: touch;
}

/* PAGE HEADER */
.page-header { margin-bottom: 20px; }
.page-title {
  font-size: 26px; font-weight: 800; margin-bottom: 6px;
  display: flex; align-items: center; gap: 10px;
  letter-spacing: -0.5px;
}
.page-title-icon {
  width: 44px; height: 44px;
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(245,215,110,0.20), rgba(201,162,39,0.08));
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  border: 1px solid rgba(201,162,39,0.20);
}
.page-title-icon i { font-size: 20px; color: var(--gold); }
.page-subtitle { font-size: 14px; color: var(--text-secondary); font-weight: 600; }

/* STATS */
.stats-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.stat-box {
  background: linear-gradient(135deg, rgba(255,255,255,1), rgba(248,250,255,1));
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 16px;
  box-shadow: var(--shadow-card);
}
.stat-label {
  font-size: 11px; font-weight: 700;
  color: var(--text-secondary);
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 5px;
}
.stat-label i { color: var(--gold); font-size: 11px; }
.stat-value {
  font-size: 22px; font-weight: 800;
  color: var(--text-primary);
  display: flex; align-items: center; gap: 6px;
  direction: ltr; line-height: 1;
}
.stat-value img { width: 20px; height: 20px; border-radius: 50%; }

/* FILTERS */
.filters-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 4px;
  margin-bottom: 20px;
  -webkit-overflow-scrolling: touch;
}
.filters-row::-webkit-scrollbar { display: none; }
.filter-chip {
  flex-shrink: 0;
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 9px 14px;
  border-radius: 14px;
  font-size: 12px; font-weight: 700;
  color: var(--text-secondary);
  display: flex; align-items: center; gap: 6px;
  transition: all 0.2s var(--ease-out);
  box-shadow: 0 2px 8px rgba(30,40,80,0.04);
}
.filter-chip i { font-size: 12px; }
.filter-chip .chip-count {
  background: rgba(0,0,0,0.06);
  padding: 1px 7px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 800;
  direction: ltr;
}
.filter-chip.active {
  background: var(--gradient-primary);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 6px 18px rgba(22,24,42,0.20), inset 0 1px 0 rgba(255,255,255,0.15);
}
.filter-chip.active .chip-count {
  background: rgba(255,255,255,0.20);
  color: #fff;
}

/* SECTION HEADER */
.section-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px;
  padding: 0 4px;
}
.section-title {
  font-size: 17px; font-weight: 800;
  display: flex; align-items: center; gap: 8px;
  color: var(--text-primary);
}
.section-title i { color: var(--text-secondary); font-size: 15px; }
.section-count {
  font-size: 12px; font-weight: 800;
  color: var(--text-secondary);
  background: rgba(0,0,0,0.05);
  padding: 5px 12px; border-radius: 10px;
  border: 1px solid var(--border);
  direction: ltr;
}

/* ITEMS GRID */
.items-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

/* ITEM CARD */
.item-card {
  background: linear-gradient(135deg, rgba(255,255,255,1), rgba(248,250,255,1));
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 12px;
  box-shadow: 0 6px 18px rgba(30,40,80,0.05);
  display: flex;
  flex-direction: column;
  transition: transform 0.15s var(--spring);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.item-card:active { transform: scale(0.97); }

.item-card.rare { border-color: rgba(59,111,219,0.20); background: linear-gradient(135deg, rgba(255,255,255,1), rgba(240,246,255,1)); }
.item-card.epic { border-color: rgba(150,60,255,0.20); background: linear-gradient(135deg, rgba(255,255,255,1), rgba(248,246,255,1)); }
.item-card.legendary { border-color: rgba(201,162,39,0.25); background: linear-gradient(135deg, rgba(255,255,255,1), rgba(254,249,238,1)); }

.item-rarity {
  position: absolute;
  top: 8px; right: 8px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 9px;
  font-weight: 800;
  z-index: 2;
  letter-spacing: 0.3px;
}
.item-card.common .item-rarity { background: rgba(0,0,0,0.06); color: var(--text-secondary); border: 1px solid var(--border); }
.item-card.rare .item-rarity { background: rgba(59,111,219,0.10); color: #3b6fdb; border: 1px solid rgba(59,111,219,0.20); }
.item-card.epic .item-rarity { background: rgba(150,60,255,0.10); color: #963cff; border: 1px solid rgba(150,60,255,0.20); }
.item-card.legendary .item-rarity { background: rgba(201,162,39,0.12); color: var(--gold); border: 1px solid rgba(201,162,39,0.25); }

.item-image-wrap {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 14px;
  background: rgba(0,0,0,0.03);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
  overflow: hidden;
  border: 1px solid rgba(0,0,0,0.04);
}
.item-card.rare .item-image-wrap { background: rgba(59,111,219,0.04); }
.item-card.epic .item-image-wrap { background: rgba(150,60,255,0.04); }
.item-card.legendary .item-image-wrap { background: rgba(201,162,39,0.05); }

.item-image {
  width: 70%;
  height: 70%;
  object-fit: contain;
  filter: drop-shadow(0 6px 14px rgba(30,40,80,0.15));
}

.item-name {
  font-size: 13px;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item-source {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.item-source i { font-size: 9px; }

.item-price {
  background: rgba(201,162,39,0.10);
  border: 1px solid rgba(201,162,39,0.20);
  border-radius: 10px;
  padding: 7px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 800;
  color: var(--gold);
  margin-bottom: 8px;
  direction: ltr;
}
.item-price img { width: 14px; height: 14px; border-radius: 50%; }

.item-sell-btn {
  width: 100%;
  padding: 9px;
  border-radius: 12px;
  background: var(--gradient-primary);
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: transform 0.15s var(--spring);
  box-shadow: 0 4px 12px rgba(22,24,42,0.18), inset 0 1px 0 rgba(255,255,255,0.15);
}
.item-sell-btn:active { transform: scale(0.96); }
.item-sell-btn i { font-size: 11px; }

.item-unsellable {
  background: rgba(0,0,0,0.04);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-tertiary);
  text-align: center;
  margin-bottom: 8px;
}

/* EMPTY STATE */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 40px 20px;
}
.empty-icon {
  width: 90px;
  height: 90px;
  border-radius: 24px;
  background: linear-gradient(135deg, rgba(255,255,255,1), rgba(248,250,255,1));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  color: var(--text-tertiary);
  margin: 0 auto 16px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-card);
}
.empty-state h3 {
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 6px;
  color: var(--text-primary);
}
.empty-state p {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 600;
  line-height: 1.5;
  max-width: 280px;
  margin: 0 auto 16px;
}
.empty-action {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 22px;
  border-radius: 14px;
  background: var(--gradient-primary);
  color: #fff;
  font-size: 13px;
  font-weight: 800;
  box-shadow: 0 8px 22px rgba(22,24,42,0.20), inset 0 1px 0 rgba(255,255,255,0.15);
  transition: transform 0.15s var(--spring);
}
.empty-action:active { transform: scale(0.97); }

/* SKELETON */
.skeleton-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  grid-column: 1 / -1;
}
.skeleton-card {
  background: linear-gradient(90deg, #f0f0f5 25%, #e8e8f0 50%, #f0f0f5 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 20px;
  aspect-ratio: 0.78;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* DOCK */
.dock {
  position: absolute; bottom: calc(14px + env(safe-area-inset-bottom));
  left: 14px; right: 14px;
  z-index: 100;
}
.back-btn {
  width: 100%; height: 56px; border-radius: 28px;
  background: var(--nav-bg);
  border: 1px solid var(--nav-border);
  -webkit-backdrop-filter: blur(4px) saturate(160%);
  backdrop-filter: blur(4px) saturate(160%);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  color: var(--text-primary);
  font-size: 15px; font-weight: 800;
  transition: all 0.25s var(--spring);
  box-shadow: 0 8px 24px rgba(30,40,80,0.06), inset 0 1px 0 rgba(255,255,255,0.8);
}
.back-btn i { font-size: 18px; color: var(--text-secondary); }
.back-btn:active { transform: scale(0.97); }

/* MODALS */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(20,22,40,0.42);
  z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px;
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; animation: fadeIn 0.22s var(--ease-out); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-content {
  background: linear-gradient(160deg, #ffffff 0%, #f5f7fc 100%);
  border-radius: 28px; padding: 24px;
  width: 100%; max-width: 340px; text-align: center;
  animation: popInModal 0.32s var(--spring);
  border: 1px solid rgba(0,0,0,0.06);
  box-shadow: 0 26px 70px rgba(30,40,80,0.25), inset 0 1px 0 rgba(255,255,255,0.9);
  max-height: 90vh;
  overflow-y: auto;
}
@keyframes popInModal { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.modal-item-img {
  width: 120px; height: 120px;
  border-radius: 24px;
  background: rgba(0,0,0,0.03);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.modal-item-img img { width: 75%; height: 75%; object-fit: contain; }
.modal-item-img.rare { background: rgba(59,111,219,0.06); border-color: rgba(59,111,219,0.20); }
.modal-item-img.epic { background: rgba(150,60,255,0.06); border-color: rgba(150,60,255,0.20); }
.modal-item-img.legendary { background: rgba(201,162,39,0.06); border-color: rgba(201,162,39,0.25); }

.modal-content h3 { font-size: 19px; font-weight: 800; margin-bottom: 8px; }
.modal-rarity-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 800;
  margin-bottom: 12px;
}
.modal-rarity-badge.common { background: rgba(0,0,0,0.06); color: var(--text-secondary); }
.modal-rarity-badge.rare { background: rgba(59,111,219,0.10); color: #3b6fdb; }
.modal-rarity-badge.epic { background: rgba(150,60,255,0.10); color: #963cff; }
.modal-rarity-badge.legendary { background: rgba(201,162,39,0.15); color: var(--gold); }

.modal-desc {
  font-size: 12px; color: var(--text-secondary);
  font-weight: 600; line-height: 1.6;
  margin-bottom: 14px;
  padding: 0 8px;
}
.modal-price-box {
  background: rgba(0,0,0,0.03);
  border: 1px solid var(--border);
  border-radius: 14px; padding: 14px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-bottom: 16px;
  direction: ltr;
}
.modal-price-box img { width: 24px; height: 24px; border-radius: 50%; }
.modal-price-box span { font-size: 24px; font-weight: 800; color: var(--text-primary); }
.modal-price-box small {
  font-size: 12px; color: var(--text-secondary);
  font-weight: 700; margin-right: 4px;
}

.modal-btn {
  width: 100%; padding: 15px; border-radius: 16px;
  background: var(--gradient-primary); color: #fff;
  font-size: 15px; font-weight: 800;
  transition: transform 0.15s var(--spring);
  box-shadow: 0 10px 24px rgba(22,24,42,0.22), inset 0 1px 0 rgba(255,255,255,0.15);
  margin-bottom: 8px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.modal-btn:active { transform: scale(0.97); }
.modal-btn:disabled { opacity: 0.6; pointer-events: none; }
.modal-btn-cancel {
  width: 100%; padding: 13px; border-radius: 16px;
  background: rgba(0,0,0,0.05);
  color: var(--text-secondary);
  font-size: 14px; font-weight: 700;
  border: 1px solid var(--border);
  transition: transform 0.15s var(--spring);
}
.modal-btn-cancel:active { transform: scale(0.97); }

.success-icon {
  width: 80px; height: 80px; border-radius: 50%;
  background: var(--gradient-success);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 36px;
  margin: 0 auto 16px;
  box-shadow: 0 12px 30px rgba(15,169,110,0.35);
  animation: successPop 0.5s var(--spring);
}
@keyframes successPop { 0% { transform: scale(0); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
.success-amount {
  background: rgba(201,162,39,0.10);
  border: 1px solid rgba(201,162,39,0.20);
  border-radius: 14px; padding: 14px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin: 14px 0 18px;
  direction: ltr;
}
.success-amount img { width: 24px; height: 24px; border-radius: 50%; }
.success-amount span { font-size: 24px; font-weight: 800; color: var(--text-primary); }

/* TOAST */
.toast {
  position: fixed; top: calc(var(--safe-top) + 20px); left: 50%;
  transform: translateX(-50%) translateY(-120px);
  background: linear-gradient(135deg, #ffffff, #f5f7fc);
  color: var(--text-primary);
  padding: 14px 26px; border-radius: 999px;
  font-size: 13px; font-weight: 700;
  z-index: 2000;
  transition: transform 0.4s var(--spring);
  border: 1px solid rgba(0,0,0,0.08);
  max-width: 90%; text-align: center;
  box-shadow: 0 14px 40px rgba(30,40,80,0.18), inset 0 1px 0 rgba(255,255,255,0.9);
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 380px) {
  .page-title { font-size: 22px; }
  .page-title-icon { width: 40px; height: 40px; }
  .page-title-icon i { font-size: 18px; }
  .stat-value { font-size: 19px; }
  .item-card { padding: 10px; }
  .item-name { font-size: 12px; }
  .balance-pill { font-size: 13px; padding: 3px 9px; }
  .balance-pill img { width: 17px; height: 17px; }
}
</style>
</head>
<body>

<div class="app-container">
  <header class="top-app-bar"></header>
  <div class="floating-balances">
    <div class="balance-pill">
      <img src="https://img.icons8.com/liquid-glass-color/999/starred-ticket.png" alt="Tickets">
      <span id="topTickets">0</span>
    </div>
    <div class="balance-pill">
      <img src="https://up6.cc/2026/10/17932600818491.png" alt="Stars">
      <span id="topStars">0</span>
    </div>
  </div>

  <main class="main-scroll">
    <div class="page-header">
      <h1 class="page-title">
        <div class="page-title-icon">
          <i class="fas fa-box-open"></i>
        </div>
        ممتلكاتي
      </h1>
      <p class="page-subtitle">جميع الجوائز والمكافآت التي كسبتها، جاهزة للبيع</p>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-label"><i class="fas fa-cubes"></i> عدد الممتلكات</div>
        <div class="stat-value" id="statCount">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label"><i class="fas fa-sack-dollar"></i> القيمة الإجمالية</div>
        <div class="stat-value">
          <img src="https://up6.cc/2026/10/17932600818491.png" alt="star">
          <span id="statValue">0</span>
        </div>
      </div>
    </div>

    <div class="filters-row" id="filtersRow">
      <button class="filter-chip active" data-filter="all" onclick="setFilter('all', this)">
        <i class="fas fa-layer-group"></i>
        الكل
        <span class="chip-count" id="count-all">0</span>
      </button>
      <button class="filter-chip" data-filter="clocks" onclick="setFilter('clocks', this)">
        <i class="fas fa-clock"></i>
        ساعات
        <span class="chip-count" id="count-clocks">0</span>
      </button>
      <button class="filter-chip" data-filter="gifts" onclick="setFilter('gifts', this)">
        <i class="fas fa-gift"></i>
        هدايا
        <span class="chip-count" id="count-gifts">0</span>
      </button>
      <button class="filter-chip" data-filter="rewards" onclick="setFilter('rewards', this)">
        <i class="fas fa-trophy"></i>
        مكافآت
        <span class="chip-count" id="count-rewards">0</span>
      </button>
      <button class="filter-chip" data-filter="subscriptions" onclick="setFilter('subscriptions', this)">
        <i class="fas fa-crown"></i>
        اشتراكات
        <span class="chip-count" id="count-subscriptions">0</span>
      </button>
    </div>

    <div class="section-header">
      <div class="section-title">
        <i class="fas fa-list"></i>
        <span id="sectionTitle">جميع الممتلكات</span>
      </div>
      <div class="section-count" id="sectionCount">0</div>
    </div>

    <div class="items-grid" id="itemsGrid">
      <div class="skeleton-grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </div>
  </main>

  <div class="dock">
    <button class="back-btn" onclick="goHome()">
      <i class="fas fa-arrow-right"></i>
      العودة للرئيسية
    </button>
  </div>
</div>

<!-- SELL MODAL -->
<div class="modal-overlay" id="sellModal">
  <div class="modal-content">
    <div class="modal-item-img" id="sellModalImgWrap">
      <img id="sellModalImg" src="" alt="">
    </div>
    <h3 id="sellModalName">اسم العنصر</h3>
    <div class="modal-rarity-badge" id="sellModalRarity">عادي</div>
    <p class="modal-desc" id="sellModalDesc">وصف العنصر</p>
    <div class="modal-price-box">
      <img src="https://up6.cc/2026/10/17932600818491.png" alt="star">
      <span id="sellModalPrice">0</span>
      <small>نجمة</small>
    </div>
    <button class="modal-btn" id="confirmSellBtn" onclick="confirmSell()">
      <i class="fas fa-hand-holding-dollar"></i>
      تأكيد البيع
    </button>
    <button class="modal-btn-cancel" onclick="closeModal('sellModal')">إلغاء</button>
  </div>
</div>

<!-- SUCCESS MODAL -->
<div class="modal-overlay" id="successModal">
  <div class="modal-content">
    <div class="success-icon"><i class="fas fa-check"></i></div>
    <h3>تم البيع بنجاح</h3>
    <p style="color:var(--text-secondary); font-size:13px; font-weight:600; margin-bottom:4px;">
      تمت إضافة ثمن العنصر إلى رصيدك
    </p>
    <div class="success-amount">
      <img src="https://up6.cc/2026/10/17932600818491.png" alt="star">
      <span id="successAmount">0</span>
    </div>
    <button class="modal-btn" onclick="closeModal('successModal')">حسناً</button>
  </div>
</div>

<!-- ERROR MODAL -->
<div class="modal-overlay" id="errorModal">
  <div class="modal-content">
    <div class="success-icon" style="background:var(--gradient-danger); box-shadow:0 12px 30px rgba(224,56,88,0.35);">
      <i class="fas fa-times"></i>
    </div>
    <h3>تعذر إتمام البيع</h3>
    <p id="errorMsg" style="color:var(--text-secondary); font-size:13px; font-weight:600; margin-bottom:20px;">
      حدث خطأ غير متوقع
    </p>
    <button class="modal-btn" onclick="closeModal('errorModal')">حسناً</button>
  </div>
</div>

<div class="toast" id="toast">رسالة</div>

<script>
'use strict';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCX29raUbUMwSFMIlKo_t7aDA6p6hvx7HI",
  authDomain: "starnovagame.firebaseapp.com",
  projectId: "starnovagame",
  storageBucket: "starnovagame.firebasestorage.app",
  messagingSenderId: "571608140423",
  appId: "1:571608140423:web:f1516e0572efada7068622"
};

const ASSETS = {
  star: 'https://up6.cc/2026/10/17932600818491.png',
  ticket: 'https://img.icons8.com/liquid-glass-color/999/starred-ticket.png',
  clock: 'https://img.icons8.com/liquid-glass-color/999/alarm-clock.png',
  gift: 'https://img.icons8.com/liquid-glass-color/999/gift.png',
  trophy: 'https://img.icons8.com/liquid-glass-color/999/trophy.png',
  crown: 'https://img.icons8.com/liquid-glass-color/999/crown.png',
  medal: 'https://img.icons8.com/liquid-glass-color/999/medal.png'
};

const SELL_PRICES = {
  space_clock: 799
};

const SOURCE_LABELS = {
  battle_pass: { text: 'Battle Pass', icon: 'fa-crown' },
  gift: { text: 'هدية', icon: 'fa-gift' },
  reward: { text: 'مكافأة', icon: 'fa-trophy' },
  subscription: { text: 'اشتراك', icon: 'fa-star' },
  event: { text: 'حدث خاص', icon: 'fa-fire' }
};

const RARITY_LABELS = {
  legendary: 'أسطوري',
  epic: 'ملحمي',
  rare: 'نادر',
  common: 'عادي'
};

let user = {
  id: '123456789',
  name: 'لاعب',
  stars: 0,
  tickets: 0,
  properties: []
};
let db = null;
let currentFilter = 'all';
let selectedItemForSell = null;
const tg = window.Telegram?.WebApp;

/* ============ HELPERS ============ */
function formatNum(n) {
  if (n === null || n === undefined) return '0';
  const num = Number(n);
  if (!isFinite(num)) return '0';
  const str = (num % 1 === 0) ? String(num) : num.toFixed(2);
  const [intPart, decPart] = str.split('.');
  const f = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return decPart ? f + '.' + decPart : f;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

function getItemCategory(item) {
  if (item.category) return item.category;
  if (item.id === 'space_clock') return 'clocks';
  if (item.source === 'gift') return 'gifts';
  if (item.source === 'subscription') return 'subscriptions';
  return 'rewards';
}

function getSellPrice(item) {
  if (SELL_PRICES[item.id] !== undefined) return SELL_PRICES[item.id];
  return Number(item.sellPrice) || 0;
}

function getItemImage(item) {
  if (item.image) return item.image;
  if (item.id === 'space_clock') return ASSETS.clock;
  return ASSETS.gift;
}

/* ============ TELEGRAM ============ */
function initTelegram() {
  if (!tg) return;
  tg.ready(); tg.expand();
  tg.setHeaderColor?.('#ffffff');
  tg.setBackgroundColor?.('#ffffff');
  if (tg.initDataUnsafe?.user) {
    user.id = String(tg.initDataUnsafe.user.id);
    user.name = tg.initDataUnsafe.user.first_name || 'لاعب';
  }
  if (tg.BackButton) {
    tg.BackButton.show();
    tg.BackButton.onClick(() => goHome());
  }
}

/* ============ FIREBASE ============ */
function initFirebase() {
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    loadUserData().then(() => renderAll());
  } catch (e) {
    console.log('[Props] Firebase error:', e.message);
  }
}

async function loadUserData() {
  if (!db) return;
  try {
    const doc = await db.collection('users').doc(user.id).get();
    if (doc.exists) {
      const d = doc.data();
      user.stars = d.stars || 0;
      user.tickets = d.tickets || 0;
      user.properties = Array.isArray(d.properties) ? d.properties : [];
    }
  } catch (e) {
    console.log('[Props] Load error:', e.message);
  }
}

/* ============ RENDER ============ */
function renderAll() {
  renderBalances();
  renderStats();
  renderFilters();
  renderGrid();
}

function renderBalances() {
  document.getElementById('topStars').innerText = formatNum(user.stars);
  document.getElementById('topTickets').innerText = formatNum(user.tickets);
}

function renderStats() {
  const count = user.properties.length;
  const totalValue = user.properties.reduce((sum, item) => sum + getSellPrice(item), 0);
  document.getElementById('statCount').innerText = formatNum(count);
  document.getElementById('statValue').innerText = formatNum(totalValue);
}

function renderFilters() {
  const counts = { all: user.properties.length, clocks: 0, gifts: 0, rewards: 0, subscriptions: 0 };
  user.properties.forEach(item => {
    const cat = getItemCategory(item);
    if (counts[cat] !== undefined) counts[cat]++;
    else counts.rewards++;
  });
  Object.keys(counts).forEach(k => {
    const el = document.getElementById('count-' + k);
    if (el) el.innerText = counts[k];
  });
}

function renderGrid() {
  const grid = document.getElementById('itemsGrid');
  const filtered = currentFilter === 'all'
    ? user.properties
    : user.properties.filter(item => getItemCategory(item) === currentFilter);

  document.getElementById('sectionCount').innerText = filtered.length;

  const titles = {
    all: 'جميع الممتلكات',
    clocks: 'الساعات',
    gifts: 'الهدايا',
    rewards: 'المكافآت',
    subscriptions: 'الاشتراكات'
  };
  document.getElementById('sectionTitle').innerText = titles[currentFilter] || 'الممتلكات';

  if (filtered.length === 0) {
    grid.innerHTML = renderEmptyState();
    return;
  }

  grid.innerHTML = filtered.map(item => renderCard(item)).join('');
}

function renderCard(item) {
  const rarity = item.rarity || 'common';
  const rarityLabel = RARITY_LABELS[rarity] || 'عادي';
  const price = getSellPrice(item);
  const image = getItemImage(item);
  const source = SOURCE_LABELS[item.source] || SOURCE_LABELS.reward;
  const name = item.name || 'عنصر';
  const canSell = price > 0;
  const itemJson = encodeURIComponent(JSON.stringify(item));

  return `
    <div class="item-card ${rarity}" onclick="openSellModal('${itemJson}')">
      <span class="item-rarity">${rarityLabel}</span>
      <div class="item-image-wrap">
        <img class="item-image" src="${image}" alt="${name}" onerror="this.src='${ASSETS.gift}'">
      </div>
      <div class="item-name">${name}</div>
      <div class="item-source">
        <i class="fas ${source.icon}"></i>
        <span>${source.text}</span>
      </div>
      ${canSell ? `
        <div class="item-price">
          <img src="${ASSETS.star}" alt="star">
          <span>${formatNum(price)}</span>
        </div>
        <button class="item-sell-btn" onclick="event.stopPropagation(); openSellModal('${itemJson}')">
          <i class="fas fa-hand-holding-dollar"></i>
          بيع
        </button>
      ` : `
        <div class="item-unsellable">غير قابل للبيع</div>
      `}
    </div>
  `;
}

function renderEmptyState() {
  const messages = {
    all: { icon: 'fa-box-open', title: 'لا توجد ممتلكات بعد', desc: 'اشترك في Battle Pass أو أكمل التحديات للحصول على أول ممتلكاتك', showAction: true },
    clocks: { icon: 'fa-clock', title: 'لا توجد ساعات', desc: 'احصل على ساعة الفضاء الأسطورية من خلال إكمال Battle Pass', showAction: true },
    gifts: { icon: 'fa-gift', title: 'لا توجد هدايا', desc: 'ستظهر الهدايا هنا عند استلامها', showAction: false },
    rewards: { icon: 'fa-trophy', title: 'لا توجد مكافآت', desc: 'أكمل المهام والتحديات لكسب المكافآت', showAction: false },
    subscriptions: { icon: 'fa-crown', title: 'لا توجد اشتراكات', desc: 'ستظهر عناصر الاشتراكات هنا', showAction: false }
  };
  const m = messages[currentFilter] || messages.all;

  return `
    <div class="empty-state">
      <div class="empty-icon">
        <i class="fas ${m.icon}"></i>
      </div>
      <h3>${m.title}</h3>
      <p>${m.desc}</p>
      ${m.showAction ? `
        <button class="empty-action" onclick="goToBattlePass()">
          <i class="fas fa-rocket"></i>
          اذهب إلى Battle Pass
        </button>
      ` : ''}
    </div>
  `;
}

/* ============ FILTER ============ */
function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

/* ============ SELL FLOW ============ */
function openSellModal(itemEncoded) {
  let item;
  try {
    item = JSON.parse(decodeURIComponent(itemEncoded));
  } catch (e) { return; }

  const price = getSellPrice(item);
  if (price <= 0) { showToast('هذا العنصر غير قابل للبيع'); return; }

  selectedItemForSell = item;
  const rarity = item.rarity || 'common';

  const imgWrap = document.getElementById('sellModalImgWrap');
  imgWrap.className = 'modal-item-img ' + rarity;
  document.getElementById('sellModalImg').src = getItemImage(item);
  document.getElementById('sellModalName').textContent = item.name || 'عنصر';

  const rarityEl = document.getElementById('sellModalRarity');
  rarityEl.className = 'modal-rarity-badge ' + rarity;
  rarityEl.textContent = RARITY_LABELS[rarity] || 'عادي';

  document.getElementById('sellModalDesc').textContent = item.description || 'عنصر من ممتلكاتك يمكنك بيعه مقابل نجوم';
  document.getElementById('sellModalPrice').textContent = formatNum(price);

  const btn = document.getElementById('confirmSellBtn');
  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-hand-holding-dollar"></i> تأكيد البيع';

  openModal('sellModal');
}

async function confirmSell() {
  if (!selectedItemForSell) return;
  const btn = document.getElementById('confirmSellBtn');
  if (btn.disabled) return;

  const item = selectedItemForSell;
  const sellPrice = getSellPrice(item);

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري البيع...';

  try {
    const userRef = db.collection('users').doc(user.id);

    await db.runTransaction(async (transaction) => {
      const doc = await transaction.get(userRef);
      if (!doc.exists) throw new Error('USER_NOT_FOUND');
      const data = doc.data();
      const properties = Array.isArray(data.properties) ? data.properties : [];
      const itemIndex = properties.findIndex(p => p.id === item.id && p.acquiredAt === item.acquiredAt);
      if (itemIndex === -1) throw new Error('ITEM_NOT_FOUND');

      const currentStars = data.stars || 0;
      const newProperties = properties.filter((_, i) => i !== itemIndex);

      transaction.update(userRef, {
        stars: currentStars + sellPrice,
        properties: newProperties
      });
    });

    user.stars += sellPrice;
    user.properties = user.properties.filter(p =>
      !(p.id === item.id && p.acquiredAt === item.acquiredAt)
    );

    renderAll();
    closeModal('sellModal');
    document.getElementById('successAmount').textContent = formatNum(sellPrice);
    setTimeout(() => openModal('successModal'), 200);

    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  } catch (e) {
    closeModal('sellModal');
    let errorText = 'حدث خطأ أثناء إتمام البيع. حاول مرة أخرى';
    if (e.message === 'ITEM_NOT_FOUND') errorText = 'هذا العنصر لم يعد موجوداً في ممتلكاتك';
    else if (e.message === 'USER_NOT_FOUND') errorText = 'تعذر العثور على حسابك';
    document.getElementById('errorMsg').textContent = errorText;
    setTimeout(() => openModal('errorModal'), 200);
    await loadUserData();
    renderAll();
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-hand-holding-dollar"></i> تأكيد البيع';
    selectedItemForSell = null;
  }
}

/* ============ NAVIGATION ============ */
function goHome() {
  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  if (tg?.BackButton) tg.BackButton.hide();
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.replace('index.html');
  }
}

function goToBattlePass() {
  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  if (tg?.BackButton) tg.BackButton.hide();
  window.location.href = 'space.html';
}

/* ============ INIT ============ */
document.addEventListener('DOMContentLoaded', () => {
  initTelegram();
  initFirebase();
});
</script>

</body>
</html>
