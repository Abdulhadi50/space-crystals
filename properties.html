<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>الممتلكات - Star Nova</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<style>
:root {
  --bg-main: #ffffff;
  --bg-card: rgba(255, 255, 255, 0.9);
  --bg-soft: rgba(0, 0, 0, 0.03);
  --text-primary: #151622;
  --text-secondary: #5b5d6e;
  --text-tertiary: #9395a5;
  --border: rgba(0, 0, 0, 0.08);
  --success: #0fa96e;
  --danger: #e03858;
  --warning: #c9791a;
  --gold: #b8912a;
  --purple: #8B5CF6;
  --safe-bottom: env(safe-area-inset-bottom, 20px);
  --safe-top: env(safe-area-inset-top, 20px);
  --top-bar-height: 10vh;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --gradient-primary: linear-gradient(135deg, #1a1c2e 0%, #2d3048 100%);
  --gradient-gold: linear-gradient(135deg, #F5D76E 0%, #C9A227 100%);
  --shadow-card: 0 10px 28px rgba(30, 40, 80, 0.06), 0 1px 3px rgba(0,0,0,0.04);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
  background: var(--bg-main); color: var(--text-primary);
  font-size: 15px; line-height: 1.5;
  overscroll-behavior: none; user-select: none; -webkit-user-select: none;
  direction: rtl; position: relative;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 15% 0%, rgba(91, 141, 239, 0.05), transparent 55%),
    radial-gradient(ellipse 55% 40% at 98% 12%, rgba(201, 162, 39, 0.03), transparent 55%),
    radial-gradient(ellipse 75% 55% at 50% 108%, rgba(140, 90, 220, 0.04), transparent 60%);
  pointer-events: none; z-index: 0;
}
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font: inherit; }
::-webkit-scrollbar { display: none; }

.app-container {
  display: flex; flex-direction: column; height: 100dvh;
  position: relative; z-index: 1;
  max-width: 480px; margin: 0 auto; overflow: hidden;
}

/* ============ APP BAR ============ */
.top-app-bar {
  position: absolute; top: 0; left: 0; right: 0;
  height: calc(var(--top-bar-height) + var(--safe-top));
  background: rgba(255, 255, 255, 0.55);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  z-index: 50; padding-top: var(--safe-top);
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 65%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 0%, #000 65%, transparent 100%);
}
.floating-balances {
  position: absolute;
  top: calc(var(--top-bar-height) + var(--safe-top) + 10px);
  left: 16px; right: 16px;
  display: flex; justify-content: space-between; z-index: 51;
}
.balance-pill {
  display: flex; align-items: center;
  background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(255,255,255,0.72));
  -webkit-backdrop-filter: blur(14px) saturate(170%);
  backdrop-filter: blur(14px) saturate(170%);
  border: 1px solid rgba(0, 0, 0, 0.08);
  border-radius: 999px;
  padding: 3px 10px; gap: 6px;
  color: var(--text-primary); font-weight: 800; font-size: 15px;
  box-shadow: 0 6px 18px rgba(30,40,80,0.06), inset 0 1px 0 rgba(255,255,255,0.9);
}
.balance-pill img { width: 20px; height: 20px; border-radius: 50%; }
.balance-pill span { direction: ltr; font-variant-numeric: tabular-nums; }

.main-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: calc(var(--top-bar-height) + var(--safe-top) + 60px) 16px calc(var(--safe-bottom) + 40px);
  -webkit-overflow-scrolling: touch;
}

.page-title {
  font-size: 24px; font-weight: 800;
  margin-bottom: 6px;
  letter-spacing: -0.5px;
}
.page-subtitle {
  font-size: 13px; color: var(--text-secondary);
  font-weight: 600;
  margin-bottom: 20px;
}

/* ============ STATS ============ */
.portfolio-stats {
  display: flex; gap: 12px;
  margin-bottom: 20px;
}
.stat-card {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 18px 16px;
  text-align: center;
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: -60%; right: -30%;
  width: 80%; height: 200%;
  background: radial-gradient(circle, rgba(201, 162, 39, 0.1), transparent 65%);
  pointer-events: none;
}
.stat-value {
  display: block;
  font-size: 24px;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 3px;
  direction: ltr;
  position: relative;
}
.stat-value.gold { color: var(--gold); }
.stat-value .star-inline {
  display: inline-block;
  width: 16px; height: 16px;
  border-radius: 50%;
  vertical-align: middle;
  margin-right: 2px;
}
.stat-label {
  display: block;
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 700;
  position: relative;
}

/* ============ GRID ============ */
.items-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.item-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 16px 14px;
  box-shadow: var(--shadow-card);
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: transform 0.15s var(--spring);
}
.item-card:active { transform: scale(0.98); }
.item-card.legendary {
  border-color: rgba(201, 162, 39, 0.35);
  background: linear-gradient(160deg, rgba(255, 251, 235, 0.95), rgba(255, 245, 215, 0.7));
}
.item-card.legendary::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 20%, rgba(201, 162, 39, 0.15), transparent 60%);
  pointer-events: none;
}
.item-image {
  width: 100px; height: 100px;
  margin: 0 auto 10px;
  position: relative; z-index: 1;
}
.item-image svg {
  width: 100% !important;
  height: 100% !important;
  display: block;
}
.item-rarity {
  display: inline-block;
  font-size: 10px;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 10px;
  margin-bottom: 8px;
  position: relative; z-index: 1;
}
.item-rarity.legendary {
  background: rgba(201, 162, 39, 0.15);
  color: var(--gold);
  border: 1px solid rgba(201, 162, 39, 0.35);
}
.item-name {
  font-size: 14px; font-weight: 800;
  margin-bottom: 4px;
  color: var(--text-primary);
  position: relative; z-index: 1;
}
.item-price {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 700;
  margin-bottom: 10px;
  display: flex; align-items: center; justify-content: center;
  gap: 4px;
  position: relative; z-index: 1;
  direction: ltr;
}
.item-price img { width: 14px; height: 14px; border-radius: 50%; }
.item-price b { color: var(--gold); font-size: 13px; }
.item-sell-btn {
  width: 100%;
  padding: 11px;
  border-radius: 14px;
  background: var(--gradient-primary);
  color: #ffffff;
  font-size: 12px;
  font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  gap: 6px;
  box-shadow: 0 4px 14px rgba(22, 24, 42, 0.18);
  transition: transform 0.15s var(--spring);
  position: relative; z-index: 1;
}
.item-sell-btn:active { transform: scale(0.95); }

/* ============ EMPTY ============ */
.empty-state {
  grid-column: 1 / -1;
  padding: 50px 20px;
  text-align: center;
  color: var(--text-secondary);
}
.empty-state-icon {
  font-size: 56px;
  color: var(--text-tertiary);
  margin-bottom: 16px;
  opacity: 0.45;
}
.empty-state h3 {
  font-size: 17px; font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.empty-state p {
  font-size: 13px; font-weight: 600;
  margin-bottom: 20px;
  line-height: 1.5;
}
.empty-cta {
  display: inline-flex;
  align-items: center; gap: 8px;
  padding: 14px 24px;
  border-radius: 16px;
  background: var(--gradient-primary);
  color: #ffffff;
  font-weight: 800; font-size: 14px;
  box-shadow: 0 10px 28px rgba(22, 24, 42, 0.2);
  transition: transform 0.15s var(--spring);
}
.empty-cta:active { transform: scale(0.96); }

/* ============ LOADING ============ */
.loading-state {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px; padding: 80px 20px;
  color: var(--text-secondary);
}
.loading-state i { font-size: 32px; color: var(--gold); }
.loading-state p { font-weight: 700; font-size: 14px; }

/* ============ TOAST ============ */
.toast {
  position: fixed; top: 20px; left: 50%;
  transform: translateX(-50%) translateY(-120px);
  background: linear-gradient(135deg, #ffffff, #f5f7fc);
  color: var(--text-primary);
  padding: 14px 26px; border-radius: 999px;
  font-size: 13px; font-weight: 700;
  z-index: 2000;
  transition: transform 0.4s var(--spring);
  border: 1px solid rgba(0,0,0,0.08);
  max-width: 90%; text-align: center;
  box-shadow: 0 14px 40px rgba(30,40,80,0.18);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { background: linear-gradient(135deg, #fff0f2, #ffe6ea); border-color: rgba(224, 56, 88, 0.3); color: var(--danger); }
.toast.success { background: linear-gradient(135deg, #f0fff6, #e6faf0); border-color: rgba(15, 169, 110, 0.3); color: var(--success); }

/* ============ MODAL ============ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(20,22,40,0.42);
  z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px;
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; animation: fadeIn 0.22s var(--ease-out); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-content {
  background: linear-gradient(160deg, #ffffff 0%, #f5f7fc 100%);
  border-radius: 28px; padding: 30px;
  width: 100%; max-width: 340px; text-align: center;
  animation: popInModal 0.32s var(--spring);
  border: 1px solid rgba(0,0,0,0.06);
  box-shadow: 0 26px 70px rgba(30,40,80,0.25);
}
@keyframes popInModal { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-content h3 { font-size: 20px; font-weight: 800; margin-bottom: 12px; }
.modal-content p { color: var(--text-secondary); font-size: 13px; font-weight: 600; margin-bottom: 20px; line-height: 1.55; }
.sell-breakdown {
  background: rgba(0,0,0,0.03);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 20px;
  display: flex; flex-direction: column; gap: 8px;
}
.sell-row {
  display: flex; justify-content: space-between;
  font-size: 13px; font-weight: 700;
  color: var(--text-secondary);
}
.sell-row b {
  color: var(--text-primary);
  direction: ltr;
  display: inline-flex; align-items: center; gap: 4px;
}
.sell-row b img { width: 13px; height: 13px; border-radius: 50%; }
.sell-row.total {
  padding-top: 8px;
  border-top: 1px solid var(--border);
  font-size: 15px;
}
.sell-row.total b { color: var(--success); font-size: 16px; }
.modal-actions {
  display: flex; gap: 10px;
}
.modal-btn {
  flex: 1;
  padding: 14px;
  border-radius: 16px;
  font-weight: 800; font-size: 14px;
  transition: transform 0.15s var(--spring);
}
.modal-btn.primary {
  background: var(--gradient-primary);
  color: #ffffff;
  box-shadow: 0 10px 28px rgba(22,24,42,0.22);
}
.modal-btn.danger {
  background: linear-gradient(135deg, #FF6B81, #E63950);
  color: #ffffff;
  box-shadow: 0 10px 28px rgba(230,57,80,0.3);
}
.modal-btn.secondary {
  background: rgba(0,0,0,0.06);
  color: var(--text-primary);
}
.modal-btn:active { transform: scale(0.96); }
.modal-btn:disabled { opacity: 0.5; pointer-events: none; }
</style>
</head>

<script>'use strict';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCX29raUbUMwSFMIlKo_t7aDA6p6hvx7HI",
  authDomain: "starnovagame.firebaseapp.com",
  projectId: "starnovagame",
  storageBucket: "starnovagame.firebasestorage.app",
  messagingSenderId: "571608140423",
  appId: "1:571608140423:web:f1516e0572efada7068622"
};

const STAR_ICON = 'https://up6.cc/2026/10/17932600818491.png';
const TICKET_ICON = 'https://img.icons8.com/liquid-glass-color/999/starred-ticket.png';
const ZIP_SPACE_CLOCK = 'Rolex-030-tgs-by-StickerEmojiRobot.zip';
const SELL_FEE_PERCENT = 10;

const tg = window.Telegram?.WebApp;
let db = null;
let userId = null;
let userData = {};
let items = [];
let selectedItem = null;
let isSelling = false;
const anims = {};

/* ============ HELPERS ============ */
function formatNum(n) {
  if (n === null || n === undefined) return '0';
  const num = Number(n);
  if (!isFinite(num)) return '0';
  return String(Math.floor(num)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = String(s ?? '');
  return d.innerHTML;
}
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3000);
}
function goBack() {
  try {
    if (window.history.length > 1) { window.history.back(); return; }
  } catch(e) {}
  window.location.href = './index.html';
}
function goToSpace() { window.location.href = './space.html'; }

/* ============ TGS LOADER ============ */
const TGS = {
  _zipCache: {}, _loading: {},
  async loadZip(zipName) {
    if (this._zipCache[zipName]) return this._zipCache[zipName];
    if (this._loading[zipName]) return this._loading[zipName];
    this._loading[zipName] = (async () => {
      if (!window.JSZip || !window.pako) throw new Error('libs not ready');
      const resp = await fetch('./' + zipName, { cache: 'force-cache' });
      if (!resp.ok) throw new Error('ZIP fetch ' + resp.status);
      const zip = await JSZip.loadAsync(await resp.arrayBuffer());
      const files = Object.values(zip.files).filter(f => !f.dir && f.name.toLowerCase().endsWith('.tgs')).sort((a, b) => a.name.localeCompare(b.name));
      const list = [];
      for (const f of files) {
        try {
          const compressed = await f.async('uint8array');
          const text = pako.ungzip(compressed, { to: 'string' });
          list.push(JSON.parse(text));
        } catch (e) {}
      }
      if (!list.length) throw new Error('No valid TGS');
      this._zipCache[zipName] = list;
      return list;
    })();
    try { return await this._loading[zipName]; } finally { delete this._loading[zipName]; }
  },
  async playIn(element, zipName) {
    if (!element) throw new Error('element missing');
    const list = await this.loadZip(zipName);
    if (anims[element.id]) { try { anims[element.id].destroy(); } catch(e) {} }
    element.innerHTML = '';
    const anim = lottie.loadAnimation({
      container: element, renderer: 'svg', loop: true, autoplay: true,
      animationData: list[0],
      rendererSettings: { preserveAspectRatio: 'xMidYMid meet' }
    });
    anims[element.id] = anim;
    return anim;
  }
};

async function loadItemAnimations() {
  for (let i = 0; i < 60; i++) {
    if (window.lottie && window.JSZip && window.pako) break;
    await new Promise(r => setTimeout(r, 100));
  }
  if (!window.lottie) return;
  items.forEach(item => {
    if (item.id === 'spaceClock') {
      const el = document.getElementById('item-tgs-' + item.id);
      if (el) TGS.playIn(el, ZIP_SPACE_CLOCK).catch(() => {});
    }
  });
}

/* ============ TELEGRAM ============ */
function initTelegram() {
  if (!tg) {
    userId = localStorage.getItem('sn_demo_id') || 'demo_' + Date.now();
    localStorage.setItem('sn_demo_id', userId);
    return false;
  }
  tg.ready(); tg.expand();
  if (tg.setHeaderColor) tg.setHeaderColor('#ffffff');
  if (tg.setBackgroundColor) tg.setBackgroundColor('#ffffff');
  if (tg.BackButton) {
    tg.BackButton.show();
    tg.BackButton.onClick(() => goBack());
  }
  const u = tg.initDataUnsafe?.user;
  if (u) { userId = String(u.id); return true; }
  userId = localStorage.getItem('sn_demo_id') || 'demo_' + Date.now();
  localStorage.setItem('sn_demo_id', userId);
  return false;
}

/* ============ FIREBASE ============ */
async function initFirebase() {
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  try { await db.enablePersistence({ synchronizeTabs: true }); } catch(e) {}
}

async function loadUserData() {
  if (!db || !userId) throw new Error('no user');
  const ref = db.collection('users').doc(userId);
  const doc = await ref.get();
  if (!doc.exists) {
    await ref.set({
      telegramId: userId, name: 'لاعب',
      stars: 0, tickets: 0,
      ownedItems: [],
      createdAt: Date.now()
    }, { merge: true });
    userData = { stars: 0, tickets: 0, ownedItems: [] };
  } else {
    userData = doc.data();
  }
  items = Array.isArray(userData.ownedItems) ? userData.ownedItems.slice() : [];
}

/* ============ RENDER ============ */
function renderUI() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
  document.getElementById('topStars').textContent = formatNum(userData.stars || 0);
  document.getElementById('topTickets').textContent = formatNum(userData.tickets || 0);
  document.getElementById('totalItems').textContent = items.length;
  const totalValue = items.reduce((sum, i) => sum + (i.sellPrice || 0), 0);
  const totalEl = document.getElementById('totalValue');
  totalEl.innerHTML = formatNum(totalValue);
  renderGrid();
  loadItemAnimations();
}

function renderGrid() {
  const grid = document.getElementById('itemsGrid');
  grid.innerHTML = '';

  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = `
      <div class="empty-state-icon"><i class="fas fa-box-open"></i></div>
      <h3>لا تملك أي ممتلكات</h3>
      <p>احصل على ساعة الفضاء الأسطورية من الموسم الأول</p>
      <button class="empty-cta" onclick="goToSpace()">
        <i class="fas fa-star"></i>
        اذهب للموسم الأول
      </button>
    `;
    grid.appendChild(empty);
    return;
  }

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'item-card ' + (item.rarity || 'common');

    let imageHtml = '';
    if (item.id === 'spaceClock') {
      imageHtml = `<div class="item-image" id="item-tgs-${item.id}"></div>`;
    } else {
      imageHtml = `<div class="item-image"><i class="fas fa-gem" style="font-size:48px;color:var(--gold)"></i></div>`;
    }

    const rarityLabels = { legendary: 'أسطورية', epic: 'ملحمية', rare: 'نادرة', common: 'عادية' };

    card.innerHTML = `
      ${imageHtml}
      <div class="item-rarity ${item.rarity || 'common'}">${rarityLabels[item.rarity] || 'عادية'}</div>
      <div class="item-name">${escapeHtml(item.name || 'عنصر')}</div>
      <div class="item-price">
        <span>قيمة البيع:</span>
        <b>${formatNum(item.sellPrice || 0)}</b>
        <img src="${STAR_ICON}" alt="">
      </div>
      <button class="item-sell-btn" onclick="openSellModal('${item.id}')">
        <i class="fas fa-tag"></i>
        بيع
      </button>
    `;
    grid.appendChild(card);
  });
}

/* ============ SELL ============ */
function openSellModal(itemId) {
  const item = items.find(i => i.id === itemId);
  if (!item) return;
  selectedItem = item;
  const price = item.sellPrice || 0;
  const fee = Math.floor(price * SELL_FEE_PERCENT / 100);
  const net = price - fee;
  document.getElementById('sellPriceRow').textContent = formatNum(price);
  document.getElementById('sellFeeRow').textContent = '-' + formatNum(fee);
  document.getElementById('sellNetRow').textContent = formatNum(net);
  document.getElementById('sellModal').classList.add('show');
}

function closeSellModal() {
  document.getElementById('sellModal').classList.remove('show');
  selectedItem = null;
}

async function confirmSell() {
  if (isSelling || !selectedItem) return;
  const item = selectedItem;
  const price = item.sellPrice || 0;
  const fee = Math.floor(price * SELL_FEE_PERCENT / 100);
  const net = price - fee;
  isSelling = true;
  const btn = document.getElementById('confirmSellBtn');
  btn.disabled = true;
  btn.textContent = 'جاري البيع...';

  try {
    const userRef = db.collection('users').doc(userId);
    await db.runTransaction(async (tx) => {
      const doc = await tx.get(userRef);
      const data = doc.data() || {};
      const owned = Array.isArray(data.ownedItems) ? data.ownedItems.slice() : [];
      const idx = owned.findIndex(i => i.id === item.id);
      if (idx === -1) throw new Error('not_owned');
      owned.splice(idx, 1);
      tx.update(userRef, {
        ownedItems: owned,
        stars: (data.stars || 0) + net
      });
    });
    try { await loadUserData(); } catch(e) {}
    closeSellModal();
    renderUI();
    showToast(`تم بيع ${item.name} مقابل ${formatNum(net)} نجمة`, 'success');
  } catch (e) {
    if (e.message === 'not_owned') {
      showToast('لا تملك هذا العنصر', 'error');
      try { await loadUserData(); } catch(err) {}
      renderUI();
    } else {
      showToast('حدث خطأ، حاول لاحقاً', 'error');
    }
  } finally {
    isSelling = false;
    btn.disabled = false;
    btn.textContent = 'تأكيد البيع';
  }
}

/* ============ INIT ============ */
async function init() {
  try {
    initTelegram();
    await initFirebase();
    await loadUserData();
    renderUI();
  } catch (e) {
    console.error(e);
    document.getElementById('loading').innerHTML = `
      <i class="fas fa-exclamation-circle" style="color:#e03858"></i>
      <p>تعذر تحميل البيانات</p>
      <button onclick="location.reload()" style="margin-top:12px; padding:10px 20px; background:#1a1c2e; color:#fff; border-radius:12px; font-weight:800;">إعادة المحاولة</button>
    `;
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
