<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملصق المتحرك</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #171821;
      font-family: Arial, sans-serif;
      color: white;
    }

    .container {
      text-align: center;
    }

    .sticker-box {
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
    }

    h3 {
      font-size: 16px;
      margin-top: 15px;
    }

    button {
      margin-top: 12px;
      padding: 10px 24px;
      border: 0;
      border-radius: 10px;
      background: #bea97c;
      color: #171821;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="sticker-box">
      <video id="sticker" autoplay loop muted playsinline>
        <source src="stickerget.webm" type="video/webm">
      </video>
    </div>

    <h3>الملصق المتحرك</h3>

    <button onclick="playSticker()">إعادة تشغيل الحركة</button>
  </div>

  <script>
    const sticker = document.getElementById("sticker");

    function playSticker() {
      sticker.currentTime = 0;
      sticker.play();
    }

    sticker.play().catch(() => {
      console.log("اضغط زر إعادة التشغيل لبدء الحركة.");
    });
  </script>

</body>
</html>
